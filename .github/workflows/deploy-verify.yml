name: Deploy Verify
# Post-deploy smoke check against the live site. Set a repo variable
# PRODUCTION_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://ikram-meme-and-co.vercel.app
# While the variable is unset the job skips with a notice and passes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Verify production deployment
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::notice::PRODUCTION_URL not set; skipping smoke check. Set the PRODUCTION_URL repo variable to enable it."
            exit 0
          fi
          node scripts/verify-deployment.mjs "$PRODUCTION_URL"
